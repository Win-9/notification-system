spring.application.name=5st_seung_gu

# ===== MySQL DataSource =====
spring.datasource.url=jdbc:mysql://localhost:3306/seunggu?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===== HikariCP =====
spring.datasource.hikari.maximum-pool-size=30
# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
#logging.level.org.hibernate.SQL=debug
#logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=seunggu-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== Notification =====
notification.topic=notification-events
notification.topic.partitions=3
notification.idem.key-prefix=noti:idem:
notification.idem.ttl=24h

notification.archive.retention-months=6
notification.archive.chunk-size=1000
notification.archive.cron=0 0 4 1 * *

# ==== Mock SEND API ====
mock.api.base-url=http://localhost:8081
