<svg width="680" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>알림 발송 시스템 아키텍처 v2</title>
<desc>클라이언트 요청이 알림 서버에서 Redis 멱등 판별과 MySQL(notification+outbox) 원자 저장을 거치고, Outbox 릴레이가 Kafka로 발행하며, Consumer가 Mock Send API 로 발송 후 상태를 갱신하는 구조</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .plain { fill: #444441; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="620" fill="#FFFFFF"/>

<g class="gray">
  <rect x="40" y="40" width="130" height="56" rx="4"/>
  <text x="105" y="60" class="th" text-anchor="middle" dominant-baseline="central">클라이언트</text>
  <text x="105" y="78" class="ts" text-anchor="middle" dominant-baseline="central">Idempotency-Key</text>
</g>
<line x1="170" y1="68" x2="218" y2="68" class="arr" marker-end="url(#arrow)"/>

<g class="purple">
  <rect x="220" y="40" width="190" height="64" rx="4"/>
  <text x="315" y="61" class="th" text-anchor="middle" dominant-baseline="central">알림 서버 (등록)</text>
  <text x="315" y="83" class="ts" text-anchor="middle" dominant-baseline="central">멱등 판별 · 재생(replay)</text>
</g>

<g class="teal">
  <rect x="480" y="40" width="160" height="56" rx="4"/>
  <text x="560" y="60" class="th" text-anchor="middle" dominant-baseline="central">Redis</text>
  <text x="560" y="78" class="ts" text-anchor="middle" dominant-baseline="central">SETNX 마커 · TTL</text>
</g>
<line x1="410" y1="64" x2="478" y2="64" class="arr" marker-end="url(#arrow)"/>

<line x1="315" y1="104" x2="315" y2="136" class="arr" marker-end="url(#arrow)"/>
<g class="teal">
  <rect x="220" y="138" width="190" height="76" rx="4"/>
  <text x="315" y="158" class="th" text-anchor="middle" dominant-baseline="central">MySQL</text>
  <text x="315" y="178" class="ts" text-anchor="middle" dominant-baseline="central">notification + outbox</text>
  <text x="315" y="196" class="ts" text-anchor="middle" dominant-baseline="central">한 트랜잭션(원자) 저장</text>
</g>

<line x1="315" y1="214" x2="315" y2="246" class="arr" marker-end="url(#arrow)"/>
<g class="purple">
  <rect x="220" y="248" width="190" height="56" rx="4"/>
  <text x="315" y="268" class="th" text-anchor="middle" dominant-baseline="central">Outbox 릴레이</text>
  <text x="315" y="286" class="ts" text-anchor="middle" dominant-baseline="central">1초 폴링 · ack 후 마킹</text>
</g>

<line x1="315" y1="304" x2="315" y2="336" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="338" width="410" height="120" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="52" y="356" class="th plain" dominant-baseline="central">Kafka</text>

<g class="coral">
  <rect x="60" y="375" width="115" height="56" rx="4"/>
  <text x="117" y="395" class="th" text-anchor="middle" dominant-baseline="central">WORK</text>
  <text x="117" y="413" class="ts" text-anchor="middle" dominant-baseline="central">기본 발송</text>
</g>
<g class="coral">
  <rect x="190" y="375" width="115" height="56" rx="4"/>
  <text x="247" y="395" class="th" text-anchor="middle" dominant-baseline="central">WAIT</text>
  <text x="247" y="413" class="ts" text-anchor="middle" dominant-baseline="central">backoff 재시도</text>
</g>
<g class="coral">
  <rect x="320" y="375" width="115" height="56" rx="4"/>
  <text x="377" y="395" class="th" text-anchor="middle" dominant-baseline="central">DEAD</text>
  <text x="377" y="413" class="ts" text-anchor="middle" dominant-baseline="central">DLT 격리</text>
</g>
<line x1="175" y1="403" x2="188" y2="403" class="arr" marker-end="url(#arrow)"/>
<line x1="305" y1="403" x2="318" y2="403" class="arr" marker-end="url(#arrow)"/>

<line x1="240" y1="458" x2="240" y2="496" class="arr" marker-end="url(#arrow)"/>
<g class="purple">
  <rect x="150" y="498" width="190" height="64" rx="4"/>
  <text x="245" y="520" class="th" text-anchor="middle" dominant-baseline="central">Consumer</text>
  <text x="245" y="540" class="ts" text-anchor="middle" dominant-baseline="central">concurrency 3 · 멱등 가드</text>
</g>

<line x1="340" y1="530" x2="478" y2="530" class="arr" marker-end="url(#arrow)"/>
<g class="gray">
  <rect x="480" y="498" width="160" height="64" rx="4"/>
  <text x="560" y="520" class="th" text-anchor="middle" dominant-baseline="central">Mock Send API</text>
  <text x="560" y="540" class="ts" text-anchor="middle" dominant-baseline="central">:8081 /mock/send</text>
</g>

<path d="M340 514 L465 514 L465 176 L412 176" class="arr" marker-end="url(#arrow)"/>
<text x="473" y="300" class="ts plain" dominant-baseline="central">상태 갱신</text>

<g class="purple"><rect x="40" y="584" width="12" height="12" rx="2"/></g>
<text x="60" y="590" class="ts plain" dominant-baseline="central">애플리케이션</text>
<g class="teal"><rect x="170" y="584" width="12" height="12" rx="2"/></g>
<text x="190" y="590" class="ts plain" dominant-baseline="central">데이터 저장소</text>
<g class="coral"><rect x="300" y="584" width="12" height="12" rx="2"/></g>
<text x="320" y="590" class="ts plain" dominant-baseline="central">Kafka 토픽</text>
<g class="gray"><rect x="430" y="584" width="12" height="12" rx="2"/></g>
<text x="450" y="590" class="ts plain" dominant-baseline="central">외부</text>
</svg>
