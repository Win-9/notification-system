<text x="52" y="254" class="ts" text-anchor="end">0</text>
<text x="52" y="180" class="ts" text-anchor="end">150</text>
<text x="52" y="107" class="ts" text-anchor="end">300</text>
<text x="52" y="34" class="ts" text-anchor="end">450</text>

<text x="60" y="272" class="ts" text-anchor="middle">00:00</text>
<text x="153" y="272" class="ts" text-anchor="middle">00:06</text>
<text x="246" y="272" class="ts" text-anchor="middle">00:12</text>
<text x="339" y="272" class="ts" text-anchor="middle">00:18</text>
<text x="432" y="272" class="ts" text-anchor="middle">00:24</text>
<text x="525" y="272" class="ts" text-anchor="middle">00:30</text>
<text x="618" y="272" class="ts" text-anchor="middle">00:36</text>

<polyline fill="none" stroke="#378ADD" stroke-width="1.5"
  points="60,176.7 91,142.4 122,171.8 153,157.1 184,203.6 215,215.8 246,213.3 277,166.9 308,181.6 339,152.2 370,83.8 401,118.0 432,39.8 463,144.9 494,108.2 525,105.8 556,88.7 587,135.1 618,118.0 649,213.3"/>

<circle cx="215" cy="215.8" r="3.5" fill="none" stroke="#BA7517" stroke-width="1.5"/>
<text x="205" y="238" class="ts" fill="#854F0B">저점 ~70 (워밍업 구간)</text>
<circle cx="432" cy="39.8" r="3.5" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
<text x="444" y="42" class="ts" fill="#0F6E56">피크 428.5</text>
</svg>
