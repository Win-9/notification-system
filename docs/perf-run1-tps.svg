<svg width="680" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>1차 부하 테스트 TPS 추이</title>
<desc>vuser 10, 1분 동안의 TPS 변화 — 초반 워밍업 저점(약 70)과 후반 피크(428.5)를 보이는 곡선. nGrinder 리포트를 재구성한 차트.</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .grid { stroke: #D3D1C7; stroke-width: 0.5; stroke-dasharray: 3 3; }
</style>
<rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>

<line x1="60" y1="250" x2="650" y2="250" class="grid"/>
<line x1="60" y1="176.7" x2="650" y2="176.7" class="grid"/>
<line x1="60" y1="103.3" x2="650" y2="103.3" class="grid"/>
