<svg width="680" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>3차 부하 테스트 TPS 추이 (HikariCP pool 30)</title>
<desc>vuser 10, 1분 동안의 TPS 변화 — 초반 워밍업 저점(약 55) 후 후반 450~550 고원과 피크 547을 보이는 곡선. nGrinder 리포트를 재구성한 차트.</desc>
