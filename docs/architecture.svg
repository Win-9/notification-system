<svg width="680" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>알림 발송 시스템 아키텍처</title>
<desc>클라이언트 요청이 알림 서버에서 Redis 멱등 판별과 MySQL 저장을 거쳐, 커밋 후 Kafka(WORK/WAIT/DEAD 토픽)로 발행되고, Consumer가 채널별 Sender로 발송한 뒤 MySQL 상태를 갱신하는 구조</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .plain { fill: #444441; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="520" fill="#FFFFFF"/>

<g class="gray">
  <rect x="40" y="40" width="140" height="56" rx="4"/>
  <text x="110" y="60" class="th" text-anchor="middle" dominant-baseline="central">클라이언트</text>
  <text x="110" y="78" class="ts" text-anchor="middle" dominant-baseline="central">Idempotency-Key</text>
</g>

<g class="purple">
  <rect x="230" y="40" width="190" height="56" rx="4"/>
  <text x="325" y="60" class="th" text-anchor="middle" dominant-baseline="central">알림 서버 (Producer)</text>
  <text x="325" y="78" class="ts" text-anchor="middle" dominant-baseline="central">멱등 판별 후 저장</text>
</g>

<g class="teal">
  <rect x="480" y="40" width="160" height="56" rx="4"/>
  <text x="560" y="60" class="th" text-anchor="middle" dominant-baseline="central">Redis</text>
  <text x="560" y="78" class="ts" text-anchor="middle" dominant-baseline="central">SETNX 마커 · TTL</text>
</g>

<g class="teal">
  <rect x="480" y="130" width="160" height="56" rx="4"/>
  <text x="560" y="150" class="th" text-anchor="middle" dominant-baseline="central">MySQL</text>
  <text x="560" y="168" class="ts" text-anchor="middle" dominant-baseline="central">상태 영구 저장</text>
</g>

<line x1="180" y1="68" x2="228" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="60" x2="478" y2="60" class="arr" marker-end="url(#arrow)"/>
<path d="M420 82 L450 82 L450 158 L478 158" class="arr" marker-end="url(#arrow)"/>

<line x1="325" y1="96" x2="325" y2="148" class="arr" marker-end="url(#arrow)"/>
<text x="335" y="122" class="ts plain" dominant-baseline="central">AFTER_COMMIT 발행</text>

<rect x="40" y="150" width="440" height="120" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="52" y="168" class="th plain" dominant-baseline="central">Kafka</text>

<g class="coral">
  <rect x="60" y="185" width="125" height="56" rx="4"/>
  <text x="122" y="205" class="th" text-anchor="middle" dominant-baseline="central">WORK</text>
  <text x="122" y="223" class="ts" text-anchor="middle" dominant-baseline="central">기본 발송 토픽</text>
</g>
<g class="coral">
  <rect x="200" y="185" width="125" height="56" rx="4"/>
  <text x="262" y="205" class="th" text-anchor="middle" dominant-baseline="central">WAIT</text>
  <text x="262" y="223" class="ts" text-anchor="middle" dominant-baseline="central">backoff 재시도</text>
</g>
<g class="coral">
  <rect x="340" y="185" width="125" height="56" rx="4"/>
  <text x="402" y="205" class="th" text-anchor="middle" dominant-baseline="central">DEAD</text>
  <text x="402" y="223" class="ts" text-anchor="middle" dominant-baseline="central">DLT 격리</text>
</g>
<line x1="185" y1="213" x2="198" y2="213" class="arr" marker-end="url(#arrow)"/>
<line x1="325" y1="213" x2="338" y2="213" class="arr" marker-end="url(#arrow)"/>

<line x1="240" y1="270" x2="240" y2="308" class="arr" marker-end="url(#arrow)"/>

<g class="purple">
  <rect x="150" y="310" width="180" height="56" rx="4"/>
  <text x="240" y="330" class="th" text-anchor="middle" dominant-baseline="central">Consumer</text>
  <text x="240" y="348" class="ts" text-anchor="middle" dominant-baseline="central">멱등 가드 후 발송</text>
</g>

<path d="M330 338 L560 338 L560 188" class="arr" marker-end="url(#arrow)"/>

<line x1="200" y1="366" x2="125" y2="398" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="366" x2="260" y2="398" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="366" x2="395" y2="398" class="arr" marker-end="url(#arrow)"/>

<g class="gray">
  <rect x="60" y="400" width="126" height="52" rx="4"/>
  <text x="123" y="418" class="th" text-anchor="middle" dominant-baseline="central">KakaoSender</text>
  <text x="123" y="436" class="ts" text-anchor="middle" dominant-baseline="central">Mock 로그</text>
</g>
<g class="gray">
  <rect x="200" y="400" width="126" height="52" rx="4"/>
  <text x="263" y="418" class="th" text-anchor="middle" dominant-baseline="central">EmailSender</text>
  <text x="263" y="436" class="ts" text-anchor="middle" dominant-baseline="central">Mock 로그</text>
</g>
<g class="gray">
  <rect x="340" y="400" width="126" height="52" rx="4"/>
  <text x="403" y="418" class="th" text-anchor="middle" dominant-baseline="central">SmsSender</text>
  <text x="403" y="436" class="ts" text-anchor="middle" dominant-baseline="central">Mock 로그</text>
</g>

<g class="purple"><rect x="40" y="482" width="12" height="12" rx="2"/></g>
<text x="60" y="488" class="ts plain" dominant-baseline="central">애플리케이션</text>
<g class="teal"><rect x="170" y="482" width="12" height="12" rx="2"/></g>
<text x="190" y="488" class="ts plain" dominant-baseline="central">데이터 저장소</text>
<g class="coral"><rect x="300" y="482" width="12" height="12" rx="2"/></g>
<text x="320" y="488" class="ts plain" dominant-baseline="central">Kafka 토픽</text>
</svg>
