<svg width="680" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
<title>2차 부하 테스트 TPS 추이 (concurrency 3)</title>
<desc>vuser 10, 1분 동안의 TPS 변화 — 초반 워밍업 저점(약 100) 후 후반에 400~530의 고원이 형성되는 곡선. nGrinder 리포트를 재구성한 차트.</desc>
