  text { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .grid { stroke: #D3D1C7; stroke-width: 0.5; stroke-dasharray: 3 3; }
</style>
