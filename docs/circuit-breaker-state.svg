<svg width="680" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
<title>서킷브레이커 상태 전이</title>
<desc>CLOSED에서 실패율 50% 초과 시 OPEN으로 전이하고, 30초 후 HALF_OPEN에서 시험 호출 3건을 통과시켜 성공하면 CLOSED로 복귀, 실패하면 다시 OPEN으로 재차단되는 상태도</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .green rect { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
  .green .th { fill: #27500A; } .green .ts { fill: #3B6D11; }
  .red rect { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 0.5; }
  .red .th { fill: #791F1F; } .red .ts { fill: #A32D2D; }
  .amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .amber .th { fill: #633806; } .amber .ts { fill: #854F0B; }
  .plain { fill: #444441; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>

<g class="green">
  <rect x="40" y="60" width="150" height="60" rx="4"/>
  <text x="115" y="80" class="th" text-anchor="middle" dominant-baseline="central">CLOSED</text>
  <text x="115" y="100" class="ts" text-anchor="middle" dominant-baseline="central">정상 통과 · 실패율 집계</text>
</g>

<line x1="190" y1="80" x2="288" y2="80" class="arr" marker-end="url(#arrow)"/>
<text x="239" y="60" class="ts plain" text-anchor="middle">실패율 50% 초과</text>
<text x="239" y="44" class="ts plain" text-anchor="middle">(실측 66.7%)</text>

<g class="red">
  <rect x="290" y="60" width="150" height="60" rx="4"/>
  <text x="365" y="80" class="th" text-anchor="middle" dominant-baseline="central">OPEN</text>
  <text x="365" y="100" class="ts" text-anchor="middle" dominant-baseline="central">차단 · 즉시 실패</text>
</g>

<line x1="440" y1="90" x2="488" y2="90" class="arr" marker-end="url(#arrow)"/>
<text x="464" y="72" class="ts plain" text-anchor="middle">30초 후</text>

<g class="amber">
  <rect x="490" y="60" width="150" height="60" rx="4"/>
  <text x="565" y="80" class="th" text-anchor="middle" dominant-baseline="central">HALF_OPEN</text>
  <text x="565" y="100" class="ts" text-anchor="middle" dominant-baseline="central">시험 호출 3건만</text>
</g>

<path d="M540 120 L540 170 L115 170 L115 122" class="arr" marker-end="url(#arrow)"/>
<text x="330" y="186" class="ts plain" text-anchor="middle">시험 3건 성공 → 복귀</text>

<path d="M590 120 L590 210 L365 210 L365 122" class="arr" marker-end="url(#arrow)"/>
<text x="478" y="226" class="ts plain" text-anchor="middle">시험 실패 → 재차단</text>

<rect x="40" y="248" width="600" height="52" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="52" y="266" class="ts plain" dominant-baseline="central">차단 중 지표: notPermittedCalls — 외부 API 에 도달하지 않고 즉시 실패한 호출 수</text>
<text x="52" y="286" class="ts plain" dominant-baseline="central">실측: OPEN 구간에서 약 2,000건 차단 (그만큼 Consumer 스레드 점유와 상대 부하를 회피)</text>
</svg>
