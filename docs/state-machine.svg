<svg width="680" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>알림 상태 머신</title>
<desc>PENDING에서 PROCESSING을 거쳐 SENT로 가는 정상 경로와, 실패 시 RETRY_WAIT 재시도 루프, 재시도 소진 시 FAILED, 복구 불가 시 DEAD로 격리되는 상태 전이도</desc>
<style>
  text { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .gray .th { fill: #444441; } .gray .ts { fill: #5F5E5A; }
  .blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
  .blue .th { fill: #0C447C; } .blue .ts { fill: #185FA5; }
  .green rect { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.5; }
  .green .th { fill: #27500A; } .green .ts { fill: #3B6D11; }
  .amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .amber .th { fill: #633806; } .amber .ts { fill: #854F0B; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
  .red rect { fill: #FCEBEB; stroke: #A32D2D; stroke-width: 0.5; }
  .red .th { fill: #791F1F; } .red .ts { fill: #A32D2D; }
  .plain { fill: #444441; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="360" fill="#FFFFFF"/>

<g class="gray">
  <rect x="40" y="60" width="140" height="52" rx="4"/>
  <text x="110" y="78" class="th" text-anchor="middle" dominant-baseline="central">PENDING</text>
  <text x="110" y="96" class="ts" text-anchor="middle" dominant-baseline="central">접수됨</text>
</g>
<line x1="180" y1="86" x2="258" y2="86" class="arr" marker-end="url(#arrow)"/>

<g class="blue">
  <rect x="260" y="60" width="150" height="52" rx="4"/>
  <text x="335" y="78" class="th" text-anchor="middle" dominant-baseline="central">PROCESSING</text>
  <text x="335" y="96" class="ts" text-anchor="middle" dominant-baseline="central">발송 처리 중</text>
</g>
<line x1="410" y1="86" x2="488" y2="86" class="arr" marker-end="url(#arrow)"/>
<text x="435" y="72" class="ts plain" dominant-baseline="central">성공</text>

<g class="green">
  <rect x="490" y="60" width="150" height="52" rx="4"/>
  <text x="565" y="78" class="th" text-anchor="middle" dominant-baseline="central">SENT</text>
  <text x="565" y="96" class="ts" text-anchor="middle" dominant-baseline="central">발송 완료 · 종결</text>
</g>

<line x1="310" y1="112" x2="310" y2="178" class="arr" marker-end="url(#arrow)"/>
<text x="255" y="145" class="ts plain" dominant-baseline="central">실패</text>
<line x1="360" y1="178" x2="360" y2="112" class="arr" marker-end="url(#arrow)"/>
<text x="368" y="145" class="ts plain" dominant-baseline="central">재시도</text>

<g class="amber">
  <rect x="260" y="180" width="150" height="52" rx="4"/>
  <text x="335" y="198" class="th" text-anchor="middle" dominant-baseline="central">RETRY_WAIT</text>
  <text x="335" y="216" class="ts" text-anchor="middle" dominant-baseline="central">backoff 재시도 대기</text>
</g>
<line x1="410" y1="206" x2="488" y2="206" class="arr" marker-end="url(#arrow)"/>
<text x="415" y="192" class="ts plain" dominant-baseline="central">소진(DLT)</text>

<g class="coral">
  <rect x="490" y="180" width="150" height="52" rx="4"/>
  <text x="565" y="198" class="th" text-anchor="middle" dominant-baseline="central">FAILED</text>
  <text x="565" y="216" class="ts" text-anchor="middle" dominant-baseline="central">실패 확정 · 복구 여지</text>
</g>

<line x1="335" y1="232" x2="400" y2="278" class="arr" marker-end="url(#arrow)"/>
<line x1="565" y1="232" x2="500" y2="278" class="arr" marker-end="url(#arrow)"/>
<text x="290" y="262" class="ts plain" dominant-baseline="central">복구 불가</text>

<g class="red">
  <rect x="375" y="280" width="150" height="52" rx="4"/>
  <text x="450" y="298" class="th" text-anchor="middle" dominant-baseline="central">DEAD</text>
  <text x="450" y="316" class="ts" text-anchor="middle" dominant-baseline="central">격리 · 운영자 확인</text>
</g>
</svg>
