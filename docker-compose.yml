services:
  mysql:
    image: mysql:8.0
    container_name: seunggu-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: seunggu
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  mysql-replica:
    image: mysql:8.0
    container_name: seunggu-mysql-replica
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root1234
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --read-only=ON
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-replica-data:/var/lib/mysql
    depends_on:
      - mysql

  redis:
    image: redis:7-alpine
    container_name: seunggu-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    container_name: seunggu-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ===== 부하 테스트 (profiles: loadtest) =====
  ngrinder-controller:
    image: ngrinder/controller:3.5.9-p1
    platform: linux/amd64   # arm64 이미지가 없어 에뮬레이션으로 실행 (부팅이 매우 느림 — 수 분 소요)
    container_name: seunggu-ngrinder-controller
    profiles: ["loadtest"]
    ports:
      - "7070:80"          # 웹 UI (admin/admin)
      - "16001:16001"      # 에이전트 접속
      - "12000-12009:12000-12009"  # 테스트 실행 통신
    volumes:
      - ngrinder-data:/opt/ngrinder-controller
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

  ngrinder-agent:
    image: ngrinder/agent:3.5.9-p1
    platform: linux/amd64
    container_name: seunggu-ngrinder-agent
    profiles: ["loadtest"]
    depends_on:
      ngrinder-controller:
        condition: service_healthy
    restart: on-failure
    command: ["ngrinder-controller:80"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ngrinder-data:
  mysql-data:
  mysql-replica-data:
